<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客户信息管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:#f0f2f5;color:#333;font-size:14px}
.header{background:linear-gradient(135deg,#1a73e8,#0d47a1);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.header h1{font-size:20px;font-weight:600}
.header .stats{font-size:13px;opacity:.85}
.toolbar{background:#fff;padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid #e0e0e0;position:sticky;top:55px;z-index:99}
.toolbar button,.toolbar label.btn{padding:6px 14px;border:1px solid #d0d0d0;border-radius:6px;background:#fff;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:4px;transition:.1s;white-space:nowrap}
.toolbar button:hover,.toolbar label.btn:hover{background:#f0f4ff;border-color:#1a73e8;color:#1a73e8}
.toolbar button.danger:hover{background:#fff0f0;border-color:#d32f2f;color:#d32f2f}
.toolbar .filter-btn{padding:6px 14px;border:1px solid #d0d0d0;border-radius:6px;background:#fff;cursor:pointer;font-size:13px;white-space:nowrap}
.toolbar .filter-btn.active{background:#1a73e8;color:#fff;border-color:#1a73e8}
.toolbar .filter-btn:hover:not(.active){background:#f0f4ff;border-color:#1a73e8}
.toolbar button.primary{background:#1a73e8;color:#fff;border-color:#1a73e8}
.toolbar button.primary:hover{background:#1557b0}
.toolbar .search-box{display:flex;gap:6px;margin-left:auto}
.toolbar .search-box input{padding:5px 10px;border:1px solid #d0d0d0;border-radius:6px;font-size:13px;width:200px;outline:none}
.toolbar .search-box input:focus{border-color:#1a73e8}
.toolbar .divider{color:#ccc;font-size:12px;user-select:none}
.toolbar select.platform-filter,
.toolbar select.region-filter,
.toolbar select.hospital-filter,
.toolbar select.dept-filter{padding:5px 8px;border:1px solid #d0d0d0;border-radius:6px;font-size:13px;background:#fff;outline:none;max-width:160px;cursor:pointer}
.toolbar select.platform-filter:focus,
.toolbar select.region-filter:focus,
.toolbar select.hospital-filter:focus,
.toolbar select.dept-filter:focus{border-color:#1a73e8}
.toolbar .filter-label{font-size:12px;color:#666;margin-left:2px}
.toolbar .btn-clear-filter{font-size:12px;color:#1a73e8;background:none;border:none;cursor:pointer;padding:4px 6px}
.toolbar .btn-clear-filter:hover{text-decoration:underline}
.container{max-width:1400px;margin:0 auto;padding:14px 20px 80px}
.card{background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:10px}
.card:hover{box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card-header{padding:10px 14px 8px;display:flex;align-items:flex-start;justify-content:space-between;cursor:pointer;gap:10px}
.card-header .info{flex:1;min-width:0}
.card-header .name-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card-header .name{font-size:15px;font-weight:600;color:#1a1a1a}
.card-header .meta-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.card-header .meta-tag{font-size:11px;color:#888;background:#f5f5f5;padding:1px 7px;border-radius:3px}
.card-body{padding:0 14px 10px}
.accounts-table{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px}
.accounts-table th{background:#f8f9fa;padding:7px 8px;text-align:left;font-weight:500;border-bottom:2px solid #e0e0e0;font-size:12px;color:#555}
.accounts-table td{padding:6px 8px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
.accounts-table tr:hover td{background:#fafbff}
.accounts-table .acc-text{font-family:monospace;font-size:13px;color:#333;word-break:break-all}
.accounts-table .pwd-text{font-family:monospace;font-size:13px;color:#333;word-break:break-all}
.btn-copy{cursor:pointer;color:#1a73e8;font-size:12px;padding:2px 6px;border:1px solid #d0e0ff;border-radius:3px;background:#f5f8ff;white-space:nowrap}
.btn-copy:hover{background:#e0ebff}
.status-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;cursor:pointer;user-select:none}
.status-done{background:#e8f5e9;color:#2e7d32}
.status-none{background:#f5f5f5;color:#999}
.status-progress{background:#fff3e0;color:#e65100}
.cb-wrap{display:flex;align-items:center}
.cb-wrap input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:#1a73e8}
.action-btns{display:flex;gap:3px;flex-shrink:0}
.action-btns button{padding:4px 8px;border:1px solid transparent;border-radius:4px;cursor:pointer;font-size:12px;background:transparent;color:#888}
.action-btns button:hover{background:#f0f0f0;color:#333}
.batch-bar{background:#e8f0fe;padding:7px 20px;display:none;align-items:center;gap:12px;font-size:13px;position:sticky;top:100px;z-index:98;border-bottom:1px solid #c5d9f5;flex-wrap:wrap}
.batch-bar.show{display:flex}
.batch-bar .count{font-weight:600;color:#1a73e8}
.batch-bar .pf-sel{display:flex;align-items:center;gap:4px;font-size:12px;color:#1a73e8}
.batch-bar .pf-sel select{padding:3px 6px;border:1px solid #c5d9f5;border-radius:4px;background:#fff;font-size:12px}
.pagination{display:flex;justify-content:center;gap:5px;margin:16px 0;flex-wrap:wrap}
.pagination button{padding:5px 12px;border:1px solid #ddd;border-radius:4px;background:#fff;cursor:pointer;font-size:13px}
.pagination button.active{background:#1a73e8;color:#fff;border-color:#1a73e8}
.pagination button:hover:not(.active){background:#f0f4ff}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:10px;width:90%;max-width:560px;max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.modal-header{padding:14px 20px;border-bottom:1px solid #eee;font-size:16px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.modal-header .close{cursor:pointer;font-size:20px;color:#999;border:none;background:none}
.modal-body{padding:20px}
.modal-footer{padding:10px 20px;border-top:1px solid #eee;display:flex;gap:8px;justify-content:flex-end}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:13px;color:#555;margin-bottom:4px}
.form-group input,.form-group select{width:100%;padding:7px 10px;border:1px solid #d0d0d0;border-radius:5px;font-size:13px;outline:none}
.form-group input:focus,.form-group select:focus{border-color:#1a73e8}
.form-row{display:flex;gap:10px}
.form-row .form-group{flex:1}
.platform-entry{display:flex;gap:6px;align-items:center;margin-bottom:5px;flex-wrap:wrap}
.platform-entry .plat-combo{position:relative;display:flex;align-items:center}
.platform-entry select,.platform-entry input{padding:4px 7px;border:1px solid #ddd;border-radius:4px;font-size:12px}
.platform-entry .rm-pf{cursor:pointer;color:#d32f2f;border:none;background:none;font-size:16px;padding:0 4px}
.btn-add-pf{font-size:12px;color:#1a73e8;cursor:pointer;border:none;background:none;padding:3px 0}
.btn-add-pf:hover{text-decoration:underline}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:8px 20px;border-radius:6px;font-size:13px;z-index:2000;opacity:0;transition:opacity .3s;pointer-events:none;max-width:80%;text-align:center}
.toast.show{opacity:1}
.empty-state{text-align:center;padding:60px 20px;color:#999}
.empty-state .icon{font-size:48px;margin-bottom:10px}
input[type=file]{display:none}
.platform-mgr-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.platform-mgr-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 4px 3px 10px;background:#e8f0fe;color:#1a73e8;border-radius:14px;font-size:12px}
.platform-mgr-chip .rename{cursor:pointer;color:#1a73e8;border:none;background:none;font-size:11px;padding:0 2px}
.platform-mgr-chip .rename:hover{color:#1557b0;text-decoration:underline}
.platform-mgr-chip .del{cursor:pointer;color:#d32f2f;border:none;background:none;font-size:14px;padding:0 4px;line-height:1}
.platform-mgr-chip .del:hover{color:#b71c1c}
.platform-mgr-add{display:flex;gap:6px;align-items:center}
.platform-mgr-add input{flex:1;padding:5px 10px;border:1px solid #d0d0d0;border-radius:5px;font-size:13px;outline:none}
.platform-mgr-add button{padding:5px 14px;background:#1a73e8;color:#fff;border:none;border-radius:5px;font-size:13px;cursor:pointer}
.platform-mgr-add button:hover{background:#1557b0}
.hint{font-size:11px;color:#999;margin-top:4px}
@media(max-width:700px){
  .toolbar .search-box{margin-left:0;width:100%}
  .toolbar .search-box input{width:100%}
  .form-row{flex-direction:column;gap:0}
  .accounts-table{font-size:12px}
  .accounts-table th,.accounts-table td{padding:5px 6px}
  .toolbar select.platform-filter,
  .toolbar select.region-filter,
  .toolbar select.hospital-filter,
  .toolbar select.dept-filter{max-width:120px}
}
</style>
</head>
<body>
<div class="header">
  <h1>📋 客户信息管理</h1>
  <div class="stats" id="statsBar">共 <strong>0</strong> 条记录</div>
</div>
<div class="toolbar">
  <div id="filterBtns" style="display:flex;gap:4px">
    <button class="filter-btn active" data-status="all" onclick="setFilter('all')">全部</button>
    <button class="filter-btn" data-status="无" onclick="setFilter('无')">⬜无</button>
    <button class="filter-btn" data-status="已下单" onclick="setFilter('已下单')">📋已下单</button>
    <button class="filter-btn" data-status="学习中" onclick="setFilter('学习中')">🔄学习中</button>
    <button class="filter-btn" data-status="已完成" onclick="setFilter('已完成')">✅已完成</button>
  </div>
  <span class="divider">|</span>
  <span class="filter-label">平台</span>
  <select class="platform-filter" id="filterPlatform" onchange="onDimFilterChange()"><option value="">全部平台</option></select>
  <span class="filter-label">地区</span>
  <select class="region-filter" id="filterRegion" onchange="onDimFilterChange()"><option value="">全部地区</option></select>
  <span class="filter-label">医院</span>
  <select class="hospital-filter" id="filterHospital" onchange="onDimFilterChange()"><option value="">全部医院</option></select>
  <span class="filter-label">科室</span>
  <select class="dept-filter" id="filterDept" onchange="onDimFilterChange()"><option value="">全部科室</option></select>
  <button class="btn-clear-filter" id="clearDimBtn" onclick="clearDimFilters()" style="display:none">✕ 清空筛选</button>
  <span class="divider">|</span>
  <button onclick="openAddModal()" class="primary" style="background:#34a853;color:#fff;border-color:#34a853;font-weight:500">＋新增</button>
  <button onclick="batchMode()" id="batchBtn">☑ 批量操作</button>
  <button class="danger" onclick="deduplicate()">🧹 一键去重</button>
  <button onclick="openPlatformMgr()">🧩 平台管理</button>
  <label class="btn">📂 导入 JSON<input type="file" accept=".json" onchange="importJSON(event)"></label>
  <button onclick="exportJSON()">💾 导出 JSON</button>
  <span class="divider">|</span>
  <button onclick="exportBackup()">📦 备份</button>
  <span id="cloudStatus" style="font-size:12px;color:#666;display:inline-flex;align-items:center;gap:4px;cursor:pointer;margin-right:8px" onclick="showCloudLogin()">☁️ 未登录</span>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索姓名/医院/平台..." oninput="render()">
  </div>
</div>
<div class="batch-bar" id="batchBar">
  <span>已选 <span class="count" id="selCount">0</span> 条</span>
  <span class="pf-sel">
    复制平台：
    <select id="batchCopyPlatform"><option value="">（自动：取所有所选共有的第一个平台，无则按所选行原样复制）</option></select>
  </span>
  <button onclick="batchCopyAccounts()" style="background:#34a853;color:#fff;border-color:#34a853">📋 复制所选账号密码</button>
  <button onclick="batchEdit()" class="primary">✏ 批量修改</button>
  <button onclick="batchSetStatus('无')">⬜ 设为无</button>
  <button onclick="batchSetStatus('已下单')">📋 设已下单</button>
  <button onclick="batchSetStatus('学习中')">🔄 设学习中</button>
  <button onclick="batchSetStatus('已完成')">✅ 设已完成</button>
  <button onclick="batchDelete()" class="danger">🗑 批量删除</button>
  <button onclick="selectAll()">☑ 全选</button>
  <button onclick="clearSelection()">取消</button>
</div>
<div class="container" id="container"></div>
<div class="pagination" id="pagination"></div>

<div class="modal-overlay" id="cloudModalOverlay">
  <div class="modal">
    <div class="modal-header"><span id="cloudModalTitle">☁️ 云同步设置</span><button class="close" onclick="closeCloudModal()">✕</button></div>
    <div class="modal-body" id="cloudModalBody">
      <div class="form-group"><label>GitHub Token（个人访问令牌）</label>
        <input id="cf_token" type="password" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" style="width:100%;padding:9px 12px;border:1px solid #e0e0e0;border-radius:8px;font-size:14px">
        <div style="font-size:11px;color:#999;margin-top:4px">需要 repo 和 gist 权限。&nbsp;<a href="https://github.com/settings/tokens" target="_blank" style="color:#1a73e8">去创建 →</a></div>
      </div>
      <div class="form-group"><label>Gist ID（已创建过则自动填充）</label>
        <input id="cf_gist" placeholder="留空自动创建新 Gist" style="width:100%;padding:9px 12px;border:1px solid #e0e0e0;border-radius:8px;font-size:14px">
      </div>
      <div style="margin:12px 0;display:flex;gap:8px;flex-wrap:wrap">
        <button onclick="cloudSave()" style="padding:8px 20px;background:#1a73e8;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px">✓ 保存</button>
        <button onclick="cloudPush()" style="padding:8px 20px;background:#34a853;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px">☁️ 上传到云</button>
        <button onclick="cloudPull()" style="padding:8px 20px;background:#f9ab00;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px">☁️ 从云下载</button>
        <button onclick="cloudLogout()" style="padding:8px 20px;background:#d32f2f;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px">退出登录</button>
      </div>
      <div id="cloudLog" style="font-size:12px;color:#666;background:#f5f5f5;padding:8px;border-radius:6px;max-height:200px;overflow-y:auto;white-space:pre-wrap;line-height:1.6">就绪</div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="addModalOverlay">
  <div class="modal">
    <div class="modal-header"><span id="addModalTitle">新增客户</span><button class="close" onclick="closeAddModal()">✕</button></div>
    <div class="modal-body" id="addModalBody"></div>
    <div class="modal-footer">
      <button onclick="closeAddModal()" style="padding:6px 18px;border:1px solid #ddd;border-radius:5px;background:#fff">取消</button>
      <button onclick="saveAddModal()" style="padding:6px 18px;background:#34a853;color:#fff;border:none;border-radius:5px">保存</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header"><span id="modalTitle">编辑客户</span><button class="close" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button onclick="closeModal()" style="padding:6px 18px;border:1px solid #ddd;border-radius:5px;background:#fff">取消</button>
      <button onclick="saveModal()" style="padding:6px 18px;background:#1a73e8;color:#fff;border:none;border-radius:5px">保存</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="platMgrOverlay">
  <div class="modal">
    <div class="modal-header"><span>🧩 平台管理</span><button class="close" onclick="closePlatformMgr()">✕</button></div>
    <div class="modal-body" id="platMgrBody"></div>
    <div class="modal-footer">
      <button onclick="closePlatformMgr()" style="padding:6px 18px;background:#1a73e8;color:#fff;border:none;border-radius:5px">完成</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
//===================== 平台库 =====================
const DEFAULT_PLATFORMS = ['双卫','医博士','公需科目','举名','24小时'];
const PLATFORMS_KEY = 'client_mgr_platforms_v3';
let platformLib = []; // 当前生效的平台名数组

function loadPlatforms(){
  try{
    const raw = localStorage.getItem(PLATFORMS_KEY);
    if(raw){
      const arr = JSON.parse(raw);
      if(Array.isArray(arr) && arr.length){ platformLib = arr.map(String); return; }
    }
  }catch(e){}
  platformLib = DEFAULT_PLATFORMS.slice();
  savePlatforms();
}
function savePlatforms(){ localStorage.setItem(PLATFORMS_KEY, JSON.stringify(platformLib)); }

function ensurePlatform(p){
  if(!p) return;
  const t = String(p).trim();
  if(!t) return;
  if(!platformLib.includes(t)){
    platformLib.push(t);
    savePlatforms();
  }
}
// 启动时把数据里出现的所有平台名都收入平台库（向后兼容）
function syncPlatformsFromData(){
  (data||[]).forEach(r => (r.platforms||[]).forEach(p => ensurePlatform(p && p.platform)));
}

//===================== 内置数据 =====================
const EMBEDDED_DATA = [];

//===================== DATA =====================
let data = [];
const PAGE_SIZE = 999999;
let page = 1;
let isBatchMode = false;
let editingIds = [];
let statusFilter = 'all';
// 维度筛选
let dimFilter = { platform:'', region:'', hospital:'', department:'' };

function cleanAccount(acc){
  if(!acc)return acc;
  return String(acc).replace(/^(账号|用户名|小时)/,'');
}
function init() {
  loadPlatforms();
  const saved = localStorage.getItem('client_mgr_v2');
  if (saved) { try { data = JSON.parse(saved); cleanData(); if(data.length){syncPlatformsFromData();renderFilterOptions();render();return} } catch(e){} }
  // Use embedded data
  data = mergeByName(EMBEDDED_DATA);
  cleanData();
  syncPlatformsFromData();
  save();
  renderFilterOptions();
  render();
}
function cleanData(){
  data.forEach(r=>(r.platforms||[]).forEach(p=>{
    p.account=cleanAccount(p.account);
    if(p.platform) ensurePlatform(p.platform);
  }));
}

function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(tTimer);tTimer=setTimeout(()=>e.classList.remove('show'),2500)}
let tTimer;
function save(){localStorage.setItem('client_mgr_v2',JSON.stringify(data))}

function esc(s){if(!s)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function mergeFlat(flat){
  const m=new Map();
  flat.forEach(r=>{
    const n=(r.name||'').trim();if(!n)return;
    if(!m.has(n))m.set(n,{id:r.id||'id_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),name:n,hospital:r.hospital||'',department:r.department||'',region:r.platforms?r.region||'':(r.region||''),platforms:[],createdAt:r.createdAt||new Date().toISOString()});
    const x=m.get(n);
    if(r.hospital&&!x.hospital)x.hospital=r.hospital;
    if(r.department&&!x.department)x.department=r.department;
    if(r.region&&!x.region)x.region=r.region;
    if(r.platform&&r.account&&!x.platforms.some(p=>p.platform===r.platform&&p.account===r.account))
      x.platforms.push({platform:r.platform,account:r.account,password:r.password||'',status:r.status||'无'});
  });
  return [...m.values()];
}
function mergeByName(arr){
  const m=new Map();
  arr.forEach(r=>{
    const n=(r.name||'').trim();if(!n)return;
    if(!m.has(n))m.set(n,{...r,platforms:[...(r.platforms||[])]});
    else{
      const x=m.get(n);
      if(r.hospital&&!x.hospital)x.hospital=r.hospital;
      if(r.department&&!x.department)x.department=r.department;
      if(r.region&&!x.region)x.region=r.region;
      (r.platforms||[]).forEach(p=>{if(!x.platforms.some(ep=>ep.platform===p.platform&&ep.account===p.account))x.platforms.push(p)});
    }
  });
  return [...m.values()];
}

function uniqSorted(arr){
  return [...new Set(arr.filter(v=>v!=null && String(v).trim()!==''))].sort((a,b)=>String(a).localeCompare(String(b),'zh'));
}
function renderFilterOptions(){
  // 平台选项
  const pfSel = document.getElementById('filterPlatform');
  const cur = dimFilter.platform;
  pfSel.innerHTML = '<option value="">全部平台</option>' +
    platformLib.map(p=>`<option value="${esc(p)}" ${p===cur?'selected':''}>${esc(p)}</option>`).join('');
  // 地区/医院/科室：从数据里聚合
  const regions = uniqSorted(data.map(r=>r.region));
  const hospitals = uniqSorted(data.map(r=>r.hospital));
  const depts = uniqSorted(data.map(r=>r.department));
  const rsel = document.getElementById('filterRegion');
  rsel.innerHTML = '<option value="">全部地区</option>' + regions.map(v=>`<option value="${esc(v)}" ${v===dimFilter.region?'selected':''}>${esc(v)}</option>`).join('');

  renderFilterOptions();

function getFiltered(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  let re = data;
  if(q) re = re.filter(r=>(r.name+'|'+(r.hospital||'')+'|'+(r.department||'')+'|'+(r.region||'')+'|'+(r.platforms||[]).map(p=>p.platform+'|'+p.account).join('|')).toLowerCase().includes(q));
  // Status filter: show person if ANY platform matches the filter
  if(statusFilter!=='all'){
    re = re.filter(r=>(r.platforms||[]).some(p=>(p.status||'无')===statusFilter));
  }
  // 维度筛选
  if(dimFilter.platform){
    re = re.filter(r => (r.platforms||[]).some(p => (p.platform||'') === dimFilter.platform));
  }
  if(dimFilter.region){
    re = re.filter(r => (r.region||'') === dimFilter.region);
  }
  if(dimFilter.hospital){
    re = re.filter(r => (r.hospital||'') === dimFilter.hospital);
  }
  if(dimFilter.department){
    re = re.filter(r => (r.department||'') === dimFilter.department);
  }
  return re;
}
function setFilter(s){
  statusFilter=s;
  page=1;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.status===s));
  render();
}
function getPage(){
  const f=getFiltered();const tp=Math.max(1,Math.ceil(f.length/PAGE_SIZE));
  if(page>tp)page=tp;
  return{items:f.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE),total:f.length,totalPages:tp};
}

const STATUS_LABEL={'已完成':'✅已完成','无':'⬜无','已下单':'📋已下单','学习中':'🔄学习中'};

function render(){
  const{items,total,totalPages}=getPage();
  const totalNone=data.filter(r=>(r.platforms||[]).some(p=>(p.status||'无')==='无')).length;
  const totalOrdered=data.filter(r=>(r.platforms||[]).some(p=>p.status==='已下单')).length;
  const totalProgress=data.filter(r=>(r.platforms||[]).some(p=>p.status==='学习中')).length;
  const totalDone=data.filter(r=>(r.platforms||[]).some(p=>p.status==='已完成')).length;
  document.getElementById('statsBar').innerHTML=`共 <strong>${data.length}</strong> 条，⬜<strong>${totalNone}</strong> 📋<strong>${totalOrdered}</strong> 🔄<strong>${totalProgress}</strong> ✅<strong>${totalDone}</strong>，筛选后 <strong>${total}</strong> 条`;
  renderFilterOptions();
  const c=document.getElementById('container');

    c.innerHTML=`<div class="empty-state"><div class="icon">📂</div><p>暂无数据 — 导入 JSON 开始管理</p></div>`;

  }
  let html='';

        <td><span class="pwd-text">${esc(p.password||'')}</span> <span class="btn-copy" onclick="copyText('${esc(p.password)}')">📋</span></td>
        <td><span class="btn-copy" onclick="copyPlatform('${r.id}',${i})">整合复制</span></td>
        <td><span class="status-badge status-${sk}" onclick="toggleStatus('${r.id}',${i})">${STATUS_LABEL[sk]||sk}</span></td>
      </tr>`;
    }).join('');
    const dpt=r.department?`<span class="meta-tag">📋 ${esc(r.department)}</span>`:'';
    const hos=r.hospital?`<span class="meta-tag">🏥 ${esc(r.hospital)}</span>`:'';
    const reg=r.region?`<span class="meta-tag">📍 ${esc(r.region)}</span>`:'';
    html+=`<div class="card" id="card_${r.id}">
      <div class="card-header" onclick="toggleCard('${r.id}')">
        <div class="cb-wrap" onclick="event.stopPropagation()">
          <input type="checkbox" class="sel-cb" value="${r.id}" ${isBatchMode?'':'style="display:none"'} onchange="updateSel()">
        </div>
        <div class="info">
          <div class="name-row">
            <span class="name">${esc(r.name)}</span>
            <span style="font-size:11px;color:#aaa">${pfs.length} 平台</span>
          </div>
          <div class="meta-tags">${reg}${hos}${dpt}</div>
        </div>
        <div class="action-btns" onclick="event.stopPropagation()">
          <button onclick="editItem('${r.id}')" title="编辑">✏️</button>
          <button onclick="copyAllAccounts('${r.id}')" title="复制全部账号密码">📋全部</button>
          <button onclick="deleteItem('${r.id}')" title="删除">🗑️</button>
        </div>
      </div>
      <div class="card-body">
        <table class="accounts-table">
          <thead><tr><th style="width:80px">平台</th><th>账号</th><th>密码</th><th style="width:70px">复制</th><th style="width:80px">状态</th></tr></thead>
          <tbody>${tr}</tbody>

      </div>
    </div>`;
  });
  c.innerHTML=html;

    let s=Math.max(1,page-3),e=Math.min(totalPages,s+6);
    if(e-s+1<7)s=Math.max(1,e-6);
    if(page>1)pp+=`<button onclick="goPage(${page-1})">‹</button>`;
    for(let i=s;i<=e;i++)pp+=`<button class="${i===page?'active':''}" onclick="goPage(${i})">${i}</button>`;
    if(page<totalPages)pp+=`<button onclick="goPage(${page+1})">›</button>`;
  }
  document.getElementById('pagination').innerHTML=pp;
  updateSel();
}

//===================== 批量复制账号密码 =====================
function batchCopyAccounts(){
  const ids = getSel();
  if(!ids.length) return toast('请先勾选要复制的客户');
  const onlyPlatform = (document.getElementById('batchCopyPlatform')||{}).value || '';
  // 选中客户的实际数据
  const records = ids.map(id => data.find(d=>d.id===id)).filter(Boolean);
  if(!records.length) return toast('未找到所选数据');

  // 决定每个客户复制哪一行：
  // 1) 若 onlyPlatform 指定，优先取该平台；找不到则跳过该客户。
  // 2) 若未指定，按筛选/顺序取该客户在当前 getFiltered 顺序里的第一个（一般即列表里出现的第一个平台行）。
  const filteredIds = getFiltered().map(x=>x.id);
  const order = new Map(filteredIds.map((id,i)=>[id,i]));

  const lines = [];
  const skipped = [];
  records.forEach(r=>{
    let p = null;
    if(onlyPlatform){
      p = (r.platforms||[]).find(pp => (pp.platform||'') === onlyPlatform);
      if(!p){ skipped.push(r.name); return; }
    } else {
      // 自动：取所选客户共有的第一个出现的平台行（如果所有人都有同一平台就用之，否则按当前列表顺序的第一个）
      const common = (r.platforms||[]).slice().sort((a,b)=> (order.has(r.id) ? 0 : 1) - (order.has(r.id) ? 0 : 1))[0];
      p = common;
    }
    if(p){
      lines.push((p.account||'') + ' ' + (p.password||''));
    }
  });
  if(!lines.length) return toast(skipped.length ? '所选客户无「'+onlyPlatform+'」账号' : '无可复制的账号');
  const text = lines.join('\n');
  copyText(text);
  let msg = `已复制 ${lines.length} 组账号密码`;
  if(skipped.length) msg += `（${skipped.length} 个客户无该平台）`;
  toast(msg);
}

function deleteItem(id){
  const r=data.find(d=>d.id===id);
  if(!confirm(`删除「${r?r.name:''}」？`))return;
  data=data.filter(d=>d.id!==id);save();render();toast('已删除');
}
function batchDelete(){
  const ids=getSel();if(!ids.length)return toast('请先选择条目');
  if(!confirm(`删除 ${ids.length} 条？不可恢复。`))return;
  data=data.filter(d=>!ids.includes(d.id));save();render();toast(`已删除 ${ids.length} 条`);
  if(isBatchMode)batchMode();
}

function deduplicate(){
  const seen=new Set();let r=0;const nd=[];
  for(const x of data){
    const k=x.name+'|'+(x.hospital||'')+'|'+(x.department||'')+'|'+(x.region||'')+'|'+(x.platforms||[]).map(p=>p.platform+'|'+p.account+'|'+p.password+'|'+(p.status||'')).sort().join('||');
    if(seen.has(k)){r++;continue}seen.add(k);nd.push(x);
  }
  if(!r)return toast('没有完全重复的条目');
  if(!confirm(`发现 ${r} 条完全重复，确定删除？`))return;
  data=nd;save();render();toast(`已去重 ${r} 条`);
}

function editItem(id){editingIds=[id];const r=data.find(d=>d.id===id);openEdit(r)}
function batchEdit(){const ids=getSel();if(!ids.length)return toast('请先选择条目');editingIds=ids;openEdit(null,true)}
function batchSetStatus(s){
  const ids=getSel();if(!ids.length)return toast('请先选择条目');
  if(!confirm(`将 ${ids.length} 条的平台状态全部设为「${STATUS_LABEL[s]}」？`))return;
  const labels={'无':'⬜无','已下单':'📋已下单','学习中':'🔄学习中','已完成':'✅已完成'};
  ids.forEach(id=>{
    const r=data.find(d=>d.id===id);
    if(r)(r.platforms||[]).forEach(p=>p.status=s);
  });
  save();render();toast(`已更新 ${ids.length} 条为 ${labels[s]}`);
  if(isBatchMode)batchMode();
}

function saveModal(){
  const ids=editingIds;
  if(ids.length>1){
    const reg=document.getElementById('m_region').value.trim();const hos=document.getElementById('m_hospital').value.trim();const dep=document.getElementById('m_department').value.trim();
    let c=0;
    ids.forEach(id=>{const r=data.find(d=>d.id===id);if(!r)return;if(reg){r.region=reg;c++}if(hos){r.hospital=hos;c++}if(dep){r.department=dep;c++}});
    closeModal();save();render();toast(`已修改 ${c} 个字段`);
    if(isBatchMode)batchMode();return;
  }
  const id=ids[0];const r=data.find(d=>d.id===id);if(!r)return;
  r.name=document.getElementById('m_name').value.trim()||r.name;
  r.region=document.getElementById('m_region').value.trim();
  r.hospital=document.getElementById('m_hospital').value.trim();
  r.department=document.getElementById('m_department').value.trim();
  const np=[];
  document.querySelectorAll('#pfList .platform-entry').forEach(el=>{
    const sel=el.querySelector('select[data-plat-input="1"]');
    const acc=el.querySelector('input[id^="m_pf_acc_"]');
    const pwd=el.querySelector('input[id^="m_pf_pwd_"]');
    if(sel&&acc&&sel.value&&acc.value.trim()){
      ensurePlatform(sel.value);
      np.push({platform:sel.value,account:acc.value.trim(),password:pwd?pwd.value.trim():'',status:'无'});
    }
  });
  if(np.length)r.platforms=np;
  closeModal();save();render();toast('已保存');
}

function importJSON(ev){
  const f=ev.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=function(e){
    try{
      let d=JSON.parse(e.target.result);if(!Array.isArray(d))return toast('需要 JSON 数组');
      if(d.length&&d[0].platforms!==undefined)data=mergeByName(d);else data=mergeFlat(d);
      cleanData();syncPlatformsFromData();save();render();toast(`导入 ${data.length} 条`);
    }catch(ex){toast('导入失败: '+ex.message)}
  };
  rd.readAsText(f);ev.target.value='';
}
function exportJSON(){
  if(!data.length)return toast('无数据');
  const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='client_data.json';a.click();URL.revokeObjectURL(b);toast('已导出');
}
function exportBackup(){
  if(!data.length)return toast('无数据');
  const d=new Date();const ts=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');
  const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='SW_备份_'+ts+'.json';a.click();URL.revokeObjectURL(b);toast('备份已下载');
}
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',function(e){
  e.preventDefault();const f=e.dataTransfer.files[0];
  if(!f||!f.name.endsWith('.json'))return;
  const rd=new FileReader();
  rd.onload=function(ev){
    try{
      let d=JSON.parse(ev.target.result);if(!Array.isArray(d))return toast('无效 JSON');
      if(d.length&&d[0].platforms!==undefined)data=mergeByName(d);else data=mergeFlat(d);
      cleanData();syncPlatformsFromData();save();render();toast(`导入 ${data.length} 条`);
    }catch(ex){toast('解析失败')}
  };
  rd.readAsText(f);
});

      platformMgrAddHtml();
  } else {
    body.innerHTML = '<p style="color:#666;margin-bottom:8px;font-size:12px">在下方维护所有平台名（增/删/重命名）。所有客户的「平台」字段都会使用这里的选项。</p>' +
      '<div class="platform-mgr-list">' +
      platformLib.map((p,i)=>`<span class="platform-mgr-chip" data-i="${i}">${esc(p)}
        <button class="rename" onclick="renamePlatform(${i})" title="重命名">✎</button>
        <button class="del" onclick="deletePlatform(${i})" title="删除">×</button>
      </span>`).join('') +
      '</div>' +
      platformMgrAddHtml() +
      '<p class="hint">删除/重命名不会改动已有客户数据，但若客户使用了已删除的平台名，相关记录仍会保留显示，只是不再出现在下拉选项中。</p>';
  }
}
function platformMgrAddHtml(){
  return `<div class="platform-mgr-add">
    <input id="newPlatName" placeholder="新平台名称（任意命名，如：双卫A、成都继教）" onkeydown="if(event.key==='Enter'){addPlatformFromMgr()}">
    <button onclick="addPlatformFromMgr()">＋ 新增平台</button>
  </div>`;
}
function addPlatformFromMgr(){
  const inp = document.getElementById('newPlatName');
  const v = (inp.value||'').trim();
  if(!v){ toast('请输入平台名'); return; }
  if(platformLib.includes(v)){ toast('该平台已存在'); return; }
  platformLib.push(v);
  savePlatforms();
  renderPlatformMgr();
  toast('已新增：'+v);
}
function renamePlatform(i){
  const old = platformLib[i];
  const nv = prompt('重命名平台：', old);
  if(nv==null) return;
  const v = nv.trim();
  if(!v) return toast('名称不能为空');
  if(v!==old && platformLib.includes(v)) return toast('该名称已存在');
  // 同步更新所有客户数据中已用此平台名的行
  data.forEach(r=>(r.platforms||[]).forEach(p=>{ if(p.platform===old) p.platform = v; }));
  platformLib[i] = v;
  savePlatforms(); save();
  renderPlatformMgr();
  toast('已重命名');
}
function deletePlatform(i){
  const p = platformLib[i];
  if(!confirm(`删除平台「${p}」？\n（不会删除已使用此平台的客户数据，只是不再出现在下拉中）`)) return;
  platformLib.splice(i,1);
  savePlatforms();
  renderPlatformMgr();
  toast('已删除');
}

init();

function closeAddModal(){
  document.getElementById('addModalOverlay').classList.remove('open');
}
function addPfEntry(){
  const d = document.getElementById('af_pfList');
  const idx = d.querySelectorAll('.platform-entry').length;
  const firstPlat = platformLib[0] || '';
  const firstOpts = platformLib.map(p=>`<option value="${esc(p)}" ${p===firstPlat?'selected':''}>${esc(p)}</option>`).join('');
  const selId = `af_pf_plat_${idx}`;
  d.insertAdjacentHTML('beforeend', '<div class="platform-entry">' +
    `<span class="plat-combo"><select data-plat-input="1" id="${selId}">${firstOpts}</select>
       <button type="button" class="btn-add-pf" style="padding:0 4px" onclick="quickAddPlatformInCombo('${selId}')">+ 新建</button>
       <input type="text" placeholder="或输入新平台名" class="quick-new-plat" data-target="${selId}" style="width:130px;padding:3px 6px;border:1px solid #ddd;border-radius:4px;font-size:12px"></span>` +
    `<input id="af_pf_acc_${idx}" placeholder="账号" style="flex:1">` +
    `<input id="af_pf_pwd_${idx}" placeholder="密码" style="flex:1">` +

function saveAddModal(){
  const name = document.getElementById('af_name').value.trim();
  if(!name){toast('请输入姓名'); return}
  const region = document.getElementById('af_region').value.trim();
  const hospital = document.getElementById('af_hospital').value.trim();
  const dept = document.getElementById('af_dept').value.trim();
  const platforms = [];
  document.querySelectorAll('#af_pfList .platform-entry').forEach(el => {
    const sel = el.querySelector('select[data-plat-input="1"]');
    const inputs = el.querySelectorAll('input');
    // inputs: [quick-new-plat, 账号, 密码]
    const acc = inputs[1] ? inputs[1].value.trim() : '';
    if(sel && acc){
      ensurePlatform(sel.value);
      const pwd = inputs[2] ? inputs[2].value.trim() : '';
      platforms.push({platform: sel.value, account: cleanAccount(acc), password: pwd, status: '无'});
    }
  });
  if(!platforms.length){toast('请至少添加一个平台账号'); return}
  data.push({
    id: 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    name: name,
    region: region,
    hospital: hospital,
    department: dept,
    platforms: platforms,
    createdAt: new Date().toISOString()
  });
  save();
  closeAddModal();
  render();
  toast('已新增客户: ' + name);
}


//===================== ☁️ 云同步 =====================
var CLOUD_KEY = 'cloud_cfg';
function cloudInit(){
  var cfg = localStorage.getItem(CLOUD_KEY);
  if(cfg){try{var c=JSON.parse(cfg);if(c.token){updateCloudUI(true);return}}catch(e){}}
  updateCloudUI(false);
}
function updateCloudUI(loggedIn){
  var el = document.getElementById('cloudStatus');
  if(el) el.innerHTML = loggedIn ? '<span style="color:#34a853">☁️ 已登录</span>' : '<span style="color:#999">☁️ 未登录</span>';
}
function showCloudLogin(){
  var cfg = localStorage.getItem(CLOUD_KEY);
  try{var c=cfg?JSON.parse(cfg):{}}catch(e){c={}}
  document.getElementById('cf_token').value = c.token || '';
  document.getElementById('cf_gist').value = c.gistId || '';
  document.getElementById('cloudLog').textContent = c.token ? '已配置 Token，可上传或下载' : '请输入 GitHub Token';
  document.getElementById('cloudModalTitle').textContent = '☁️ 云同步设置';
  document.getElementById('cloudModalOverlay').classList.add('open');
}
function closeCloudModal(){
  document.getElementById('cloudModalOverlay').classList.remove('open');
}
function cloudSave(){
  var token = document.getElementById('cf_token').value.trim();
  var gistId = document.getElementById('cf_gist').value.trim();
  if(!token){log('请输入 GitHub Token'); return}
  localStorage.setItem(CLOUD_KEY, JSON.stringify({token: token, gistId: gistId}));
  updateCloudUI(true);
  log('配置已保存');
}
function cloudLogout(){
  if(!confirm('退出云同步？')) return;
  localStorage.removeItem(CLOUD_KEY);
  updateCloudUI(false);
  document.getElementById('cf_token').value = '';
  document.getElementById('cf_gist').value = '';
  log('已退出');
}
function cloudPush(){
  var cfg = getCloudCfg(); if(!cfg) return;
  log('正在上传数据到 GitHub...');
  var jsonData = JSON.stringify(data, null, 2);
  if(cfg.gistId){
    updateGist(cfg, jsonData, function(){
      log('✅ 上传成功！');
      toast('云同步: 上传成功');
    });
  } else {
    createGist(cfg, jsonData, function(gistId){
      cfg.gistId = gistId;
      localStorage.setItem(CLOUD_KEY, JSON.stringify(cfg));
      document.getElementById('cf_gist').value = gistId;
      log('✅ 已创建 Gist，ID: ' + gistId);
      toast('云同步: 已创建并上传');
    });
  }
}
function cloudPull(){
  var cfg = getCloudCfg(); if(!cfg) return;
  if(!cfg.gistId){log('❌ 没有 Gist ID，请先上传一次或填写已有 Gist ID'); return}
  log('正在从 GitHub 下载数据...');
  getGist(cfg, function(content){
    try{
      var remoteData = JSON.parse(content);
      if(!Array.isArray(remoteData)){log('❌ 云端数据格式错误'); return}
      var merged = mergeByName([...data, ...remoteData]);
      data = merged;
      cleanData();syncPlatformsFromData();
      save();
      render();
      log('✅ 下载并合并成功！共 ' + data.length + ' 条');
      toast('云同步: 下载成功');
    }catch(e){
      log('❌ 解析失败: ' + e.message);
    }
  });
}
function getCloudCfg(){
  var raw = localStorage.getItem(CLOUD_KEY);
  if(!raw){log('❌ 请先配置 GitHub Token'); return null}
  try{
    var cfg = JSON.parse(raw);
    if(!cfg.token){log('❌ Token 为空'); return null}
    return cfg;
  }catch(e){log('❌ 配置解析失败'); return null}
}
function log(msg){
  var el = document.getElementById('cloudLog');
  if(el) el.textContent = new Date().toLocaleTimeString() + ' ' + msg + '\n' + el.textContent;
}
// GitHub API calls
function createGist(cfg, content, cb){
  var xhr = new XMLHttpRequest();
  xhr.open('POST', 'https://api.github.com/gists', true);
  xhr.setRequestHeader('Authorization', 'token ' + cfg.token);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onload = function(){
    if(xhr.status >= 200 && xhr.status < 300){
      var resp = JSON.parse(xhr.responseText);
      cb(resp.id);
    } else {
      log('❌ 创建失败: HTTP ' + xhr.status + ' ' + xhr.statusText);
      try{var e=JSON.parse(xhr.responseText);log('  ' + (e.message||''))}catch(ee){}
    }
  };
  xhr.onerror = function(){log('❌ 网络请求失败')};
  xhr.send(JSON.stringify({
    description: '客户管理数据 - client_manager',
    public: false,
    files: {'client_data.json': {content: content}}
  }));
}
function updateGist(cfg, content, cb){
  var xhr = new XMLHttpRequest();
  xhr.open('PATCH', 'https://api.github.com/gists/' + cfg.gistId, true);
  xhr.setRequestHeader('Authorization', 'token ' + cfg.token);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onload = function(){
    if(xhr.status >= 200 && xhr.status < 300){
      cb();
    } else if(xhr.status === 404){
      log('❌ Gist 不存在，请重新创建');
    } else {
      log('❌ 上传失败: HTTP ' + xhr.status + ' ' + xhr.statusText);
      try{var e=JSON.parse(xhr.responseText);log('  ' + (e.message||''))}catch(ee){}
    }
  };
  xhr.onerror = function(){log('❌ 网络请求失败')};
  xhr.send(JSON.stringify({
    files: {'client_data.json': {content: content}}
  }));
}
function getGist(cfg, cb){
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'https://api.github.com/gists/' + cfg.gistId, true);
  xhr.setRequestHeader('Authorization', 'token ' + cfg.token);
  xhr.onload = function(){
    if(xhr.status >= 200 && xhr.status < 300){
      try{
        var resp = JSON.parse(xhr.responseText);
        var content = resp.files && resp.files['client_data.json'] && resp.files['client_data.json'].content;
        if(content) cb(content);
        else log('❌ 未找到 client_data.json 文件');
      }catch(e){log('❌ 解析响应失败')}
    } else if(xhr.status === 404){
      log('❌ Gist 不存在');
    } else {
      log('❌ 下载失败: HTTP ' + xhr.status);
    }
  };
  xhr.onerror = function(){log('❌ 网络请求失败')};
  xhr.send();
}
// Init cloud status on page load
(function(){ cloudInit(); })();
